name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dreamhigh-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dreamhigh-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pms-eng-api
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      JWT_SECRET: phase-e-ci-only-secret-not-used-in-production
      CORS_ORIGINS: http://localhost:5175
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pms-eng-api/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run prisma:migrate:deploy
      - run: npm run build
      - run: npm test -- --runInBand --coverage
      - name: Start API and await readiness
        run: |
          npm run start:prod > /tmp/dreamhigh-api.log 2>&1 &
          echo $! > /tmp/dreamhigh-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dreamhigh-api.log
          exit 1
      - name: Run authenticated PostgreSQL integration flows
        run: node scripts/phase-d-integration.mjs
      - name: Verify unauthenticated routes are protected
        run: node scripts/phase-d-auth-smoke.mjs
      - name: Run Phase F automated UAT persona smoke test
        run: node scripts/phase-f-uat-smoke.mjs
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: pms-eng-api/coverage
          if-no-files-found: ignore

    browser-e2e:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: dreamhigh-web
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: npm
            cache-dependency-path: dreamhigh-web/package-lock.json
        - run: npm ci
        - run: npx playwright install --with-deps chromium
        - run: npm run test:e2e
